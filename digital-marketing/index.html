<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mystery Discount — RevoU Blind Box</title>
<style>
  /* ============ FONT ============ */
  @font-face{
    font-family:'Silkscreen';
    src:url('/assets/silkscreen.ttf') format('truetype');
    font-weight:400;font-display:swap;
  }

  /* ============ TOKENS ============ */
  :root{
    --bg-0:#0b0a14; --bg-1:#161226; --bg-2:#1f1838;
    --purple-1:#2c2358; --purple-2:#3a2d6e; --purple-3:#6b53c9;
    --lid:#e7e8e2; --gold:#ffcf3f; --gold-deep:#f59e0b;
    --win:#34d399; --text-dim:#9b93c2; --ink:#1a1330;
    --pixel:'Silkscreen','Courier New',monospace;
    --sans:'Poppins',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-0); color:var(--lid); font-family:var(--sans);
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }

  /* ============ CABINET (portrait stage, centered on desktop) ============ */
  #cabinet{
    position:relative; width:100%; height:100dvh; margin:0 auto;
    max-width:480px; overflow:hidden; background:var(--bg-0);
  }
  @media (min-width:600px){
    body{display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(900px 700px at 50% 0%, #18122e 0%, #070610 60%),
        #070610;}
    #cabinet{height:min(92dvh,860px);border-radius:26px;
      border:1px solid #2a2350;box-shadow:0 24px 70px rgba(0,0,0,.6);}
  }

  /* ============ BACKGROUND LAYERS (shared across scenes) ============ */
  /* video sits ABOVE the CSS fallback so it never muddies the look when playing */
  #bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.78);z-index:0}
  /* CSS fallback aurora — only visible if the video can't play (e.g. file://) */
  #bgcss{position:absolute;inset:0;z-index:-1;background:
    radial-gradient(60% 50% at 50% 30%,rgba(107,83,201,.45),transparent 60%),
    radial-gradient(120% 90% at 50% 60%,#1a1438,#0a0814);}
  #bgvig{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(75% 62% at 50% 48%,transparent 45%,rgba(8,6,18,.6) 100%)}
  #fx{position:absolute;inset:0;z-index:1;pointer-events:none}

  /* ============ BRAND BADGE ============ */
  .brand{position:absolute;top:16px;left:14px;z-index:8;
    width:44px;height:44px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}

  /* ============ MUTE TOGGLE ============ */
  .mute-btn{position:absolute;top:16px;right:14px;z-index:9;
    width:38px;height:38px;border-radius:50%;border:1px solid rgba(107,83,201,.5);
    background:rgba(10,8,20,.6);color:var(--lid);font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0}
  .mute-btn:hover{background:rgba(10,8,20,.85)}
  .mute-btn:focus-visible{outline:2px solid var(--purple-3);outline-offset:2px}
  .mute-btn.muted{opacity:.7}

  /* ============ SCENE SYSTEM ============ */
  .scene{position:absolute;inset:0;z-index:5;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2.2vh,16px);
    padding:64px 22px calc(26px + env(safe-area-inset-bottom)) 22px;
    text-align:center;overflow-y:auto;}
  .scene.active{display:flex;animation:sceneIn .35s ease both}
  /* keep centered content from clipping when it's taller than the stage */
  .scene::before,.scene::after{content:"";flex:0 0 0;}
  @keyframes sceneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ============ TYPOGRAPHY ============ */
  .pixel{font-family:var(--pixel);text-transform:uppercase;letter-spacing:.02em;line-height:1.5}
  .title-logo{width:84%;max-width:330px;max-height:26vh;height:auto;object-fit:contain;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));
    animation:logopop 3.2s ease-in-out infinite}
  @keyframes logopop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.015)}}

  .scene-title{font-family:var(--pixel);text-transform:uppercase;color:var(--gold);
    font-size:clamp(15px,4.6vw,20px);letter-spacing:.02em;text-shadow:3px 3px 0 var(--ink)}

  /* ============ AMOUNT PLAQUE ============ */
  .amount{font-family:var(--pixel);text-transform:uppercase;letter-spacing:.02em;line-height:1.5;
    background:#120d24;border:2px solid var(--purple-3);border-radius:12px;
    padding:11px 20px;display:inline-flex;flex-direction:column;align-items:center;gap:5px;
    box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .amount .cap{font-size:clamp(10px,2.6vw,12px);color:#b9b0e0;letter-spacing:.12em}
  .amount .big{font-size:clamp(18px,5.4vw,24px);color:var(--gold);
    text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink)}

  /* ============ BUTTONS ============ */
  .btn{font-family:var(--pixel);text-transform:uppercase;letter-spacing:.03em;
    font-size:clamp(13px,3.6vw,15px);color:#3a2a05;
    background:linear-gradient(180deg,var(--gold),var(--gold-deep));
    border:none;border-radius:12px;padding:14px 26px;cursor:pointer;
    box-shadow:0 5px 0 #b9770a;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9770a}
  .btn:focus-visible{outline:3px solid var(--lid);outline-offset:3px}
  .btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
  .btn.pulse{animation:cta 2.2s ease-in-out infinite}
  @keyframes cta{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* ============ BOX ELEMENTS ============ */
  .boxwrap{position:relative;display:flex;align-items:center;justify-content:center}
  .box-glow{position:absolute;inset:-14% -10%;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 52%,rgba(139,108,234,.7),rgba(107,83,201,.3) 45%,transparent 70%);
    filter:blur(6px);animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
  .box-img{position:relative;width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 0 14px rgba(139,108,234,.5))}
  .box-float{animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-9px) rotate(.5deg)}}

  /* ============ LOGIN MODAL (pops over the intro) ============ */
  .modal-overlay{position:absolute;inset:0;z-index:30;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(6,5,14,.72);backdrop-filter:blur(3px)}
  .modal-overlay.open{display:flex;animation:overlayIn .2s ease both}
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}
  .modal-card{position:relative;background:var(--bg-1);border:1px solid #2a2350;border-radius:20px;
    padding:30px 22px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;
    gap:15px;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:modalIn .28s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  .modal-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--text-dim);
    font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
  .modal-close:hover{color:var(--lid)}
  .modal-close:focus-visible{outline:2px solid var(--purple-3)}
  .modal-card .mini-box{width:46px;height:auto;margin:0 auto;filter:drop-shadow(0 0 10px rgba(139,108,234,.5))}
  .modal-card h2{font-family:var(--pixel);text-transform:uppercase;color:var(--gold);text-align:center;
    font-size:clamp(14px,4vw,17px);letter-spacing:.02em;line-height:1.5;text-shadow:2px 2px 0 var(--ink)}
  .modal-card p.sub{color:var(--text-dim);font-size:13px;line-height:1.5;margin-top:-4px;text-align:center}
  .field{display:flex;flex-direction:column;gap:6px;text-align:left}
  .field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
  .field input{background:var(--bg-0);border:1px solid #2f2856;border-radius:10px;
    padding:13px 14px;color:var(--lid);font-family:var(--sans);font-size:15px}
  .field input::placeholder{color:#6a6291}
  .field input:focus{outline:none;border-color:var(--purple-3);box-shadow:0 0 0 3px rgba(107,83,201,.3)}
  .field input.err{border-color:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.25)}
  .helper{font-size:11px;color:var(--text-dim);text-align:center}
  .form-msg{font-size:12px;color:#f87171;min-height:15px;text-align:center}

  /* ============ SCENE 3: CHOOSE ============ */
  #s-choose .boxrow{display:flex;justify-content:center;align-items:flex-end;gap:10px;width:100%}
  #s-choose .choice{background:none;border:none;cursor:pointer;padding:4px;border-radius:14px;
    width:30%;transition:transform .15s;position:relative}
  #s-choose .choice .box-img{width:100%;aspect-ratio:819/1024}
  #s-choose .choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  @media (hover:hover){#s-choose .choice:hover{transform:translateY(-8px)}
    #s-choose .choice:hover .box-img{filter:drop-shadow(0 0 16px rgba(255,207,63,.6))}}
  #s-choose .choice.float1{animation:bob 3s ease-in-out infinite}
  #s-choose .choice.float2{animation:bob 3s ease-in-out .4s infinite}
  #s-choose .choice.float3{animation:bob 3s ease-in-out .8s infinite}
  #s-choose .choice.faded{opacity:0;transform:scale(.6) translateY(20px);transition:all .5s ease;pointer-events:none}
  @media (max-width:380px){#s-choose .boxrow{flex-direction:column;align-items:center}
    #s-choose .choice{width:52%}}

  /* ============ SCENE 4: SUSPENSE ============ */
  #s-suspense .boxwrap{width:62%;aspect-ratio:819/1024}
  #s-suspense .box-img.shaking{animation:shake .4s linear infinite}
  @keyframes shake{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-4px,2px) rotate(-2deg)}
    40%{transform:translate(4px,-2px) rotate(2deg)}60%{transform:translate(-3px,-2px) rotate(-1.5deg)}
    80%{transform:translate(3px,2px) rotate(1.5deg)}100%{transform:translate(0,0) rotate(0)}}
  #s-suspense .flash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.6),transparent 60%)}
  #s-suspense .hint{color:var(--text-dim);font-size:13px;line-height:1.5}

  /* ============ SCENE 5: REVEAL ============ */
  #revealFlash{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
  #confetti{position:absolute;inset:0;z-index:9;pointer-events:none}
  #s-reveal .prize-card{background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
    border:3px solid var(--gold);border-radius:20px;padding:26px 22px;width:100%;max-width:340px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    box-shadow:0 0 50px rgba(255,207,63,.3);animation:popin .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  #s-reveal .selamat{font-family:var(--pixel);text-transform:uppercase;color:var(--win);
    font-size:clamp(18px,5.4vw,24px);letter-spacing:.02em;text-shadow:2px 2px 0 var(--ink)}
  #s-reveal .open-box{width:42%;aspect-ratio:819/1024;object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(255,207,63,.5))}
  #s-reveal .won-cap{color:var(--text-dim);font-size:13px}
  #s-reveal .prize-amt{font-family:var(--pixel);font-size:clamp(24px,7vw,34px);color:var(--gold);
    letter-spacing:.02em;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink)}
  #s-reveal .small{font-size:11px;color:var(--text-dim);line-height:1.5;max-width:280px}

  /* ============ ALREADY-PLAYED / GENERIC NOTICE ============ */
  .notice-card{background:var(--bg-1);border:1px solid #2a2350;border-radius:18px;
    padding:26px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
  .notice-card h2{font-family:var(--pixel);text-transform:uppercase;color:var(--gold);
    font-size:16px;letter-spacing:.02em;line-height:1.5}
  .notice-card p{color:var(--lid);font-size:14px;line-height:1.6}

  /* ============ LOADING ============ */
  .spinner{width:26px;height:26px;border:3px solid rgba(255,255,255,.2);
    border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<div id="cabinet">
  <!-- shared background -->
  <video id="bgvid" autoplay loop muted playsinline></video>
  <div id="bgcss"></div>
  <div id="bgvig"></div>
  <canvas id="fx"></canvas>
  <img class="brand" id="brand" src="/assets/revoulogo.png" alt="RevoU">
  <canvas id="confetti"></canvas>
  <div id="revealFlash"></div>

  <!-- audio (generated) -->
  <audio id="sfxTheme" src="/assets/theme.m4a" loop preload="auto"></audio>
  <audio id="sfxSuspense" src="/assets/suspense.m4a" loop preload="auto"></audio>
  <audio id="sfxDing" src="/assets/ding.mp3" preload="auto"></audio>

  <!-- mute toggle -->
  <button class="mute-btn" id="btnMute" aria-label="Suara" aria-pressed="false">🔊</button>

  <!-- ===== SCENE 1: INTRO (first thing the user sees) ===== -->
  <section class="scene active" id="s-intro">
    <img class="title-logo" src="/assets/logo.png" alt="Mystery Discount">
    <div class="amount">
      <span class="cap">Diskon Hingga</span>
      <span class="big">Rp 3.000.000!</span>
    </div>
    <div class="boxwrap" style="width:48%;max-width:200px;aspect-ratio:819/1024;flex:0 1 auto;min-height:0">
      <div class="box-glow"></div>
      <img class="box-img box-float" src="/digital-marketing/boxes/BB_.png" alt="mystery box">
    </div>
    <button class="btn pulse" id="btnOpen">Buka Kotak →</button>
  </section>

  <!-- ===== SCENE 3: CHOOSE ===== -->
  <section class="scene" id="s-choose">
    <div class="scene-title">Pilih 1 Kotak</div>
    <div class="boxrow">
      <button class="choice float1" data-box="1"><img class="box-img" src="/digital-marketing/boxes/BB1.png" alt="Kotak 1"></button>
      <button class="choice float2" data-box="2"><img class="box-img" src="/digital-marketing/boxes/BB2.png" alt="Kotak 2"></button>
      <button class="choice float3" data-box="3"><img class="box-img" src="/digital-marketing/boxes/BB3.png" alt="Kotak 3"></button>
    </div>
    <div class="hint" style="color:var(--text-dim);font-size:13px">Tap kotak pilihanmu</div>
  </section>

  <!-- ===== SCENE 4: SUSPENSE ===== -->
  <section class="scene" id="s-suspense">
    <div class="boxwrap">
      <div class="box-glow"></div>
      <img class="box-img shaking" id="suspenseBox" src="/digital-marketing/boxes/BB1.png" alt="">
      <div class="flash" id="suspenseFlash"></div>
    </div>
    <div class="hint">Membuka kotak…</div>
  </section>

  <!-- ===== SCENE 5: REVEAL ===== -->
  <section class="scene" id="s-reveal">
    <div class="prize-card">
      <div class="selamat">Selamat! 🎉</div>
      <img class="open-box" id="revealBox" src="/digital-marketing/boxes/BB_.png" alt="">
      <div class="won-cap">Kamu memenangkan diskon</div>
      <div class="prize-amt" id="prizeAmt">Rp 1.000.000 + 1.000.000!</div>
      <button class="btn pulse" id="btnClaim">Klaim Diskonmu</button>
      <p class="small">Tunjukkan layar ini ke tim RevoU untuk klaim diskonmu.</p>
    </div>
  </section>

  <!-- ===== GENERIC NOTICE (already played / errors) ===== -->
  <section class="scene" id="s-notice">
    <div class="notice-card">
      <h2 id="noticeTitle">—</h2>
      <p id="noticeBody">—</p>
    </div>
  </section>

  <!-- ===== LOGIN MODAL (pops over the intro) ===== -->
  <div class="modal-overlay" id="loginModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <button class="modal-close" id="btnCloseLogin" aria-label="Tutup">×</button>
      <img class="mini-box" src="/digital-marketing/boxes/BB_.png" alt="">
      <h2 id="loginTitle">Isi Data Dulu</h2>
      <p class="sub">Lalu pilih kotak &amp; menangkan diskon!</p>
      <div class="field">
        <label for="inName">Nama</label>
        <input id="inName" type="text" autocomplete="name" placeholder="Nama lengkap" maxlength="60">
      </div>
      <div class="field">
        <label for="inEmail">Email</label>
        <input id="inEmail" type="email" autocomplete="email" placeholder="nama@email.com" maxlength="120">
      </div>
      <div class="form-msg" id="loginMsg"></div>
      <button class="btn" id="btnStart">Mulai Main →</button>
      <div class="helper">1 email = 1 kesempatan</div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
// Paste your Google Apps Script Web App /exec URL here to enable
// Sheets logging + one-play-per-email. Leave "" to run offline.
const SHEET_API = "https://script.google.com/macros/s/AKfycbwndTjMxdGwmOP3FaEIdEAhTSUYEkH1Jfa2yGlr8Il1JqAFRV3T7HCMQKDCn5tIKZvxdw/exec";

// Which program/track this page belongs to. Logged to the shared sheet's
// "Program" column so plays from each variation can be told apart.
const TRACK = "Digital Marketing";

// Weighted prizes (Rp 1.000.000 base + bonus): +2jt ~10%, +1jt ~70%, +BNSP ~20%.
// BNSP is a certification (no cash value), so its numeric prize is the 1.000.000 base.
const PRIZES = [
  { amount: 3000000, label: "Rp 1.000.000 + 2.000.000!", weight: 10 },
  { amount: 2000000, label: "Rp 1.000.000 + 1.000.000!", weight: 70 },
  { amount: 1000000, label: "Rp 1.000.000 + BNSP",       weight: 20 },
];
const prizeLabel = amt => (PRIZES.find(p => p.amount === Number(amt)) || {}).label || rupiah(amt);

const STORAGE_KEY = "revou_blindbox_played";

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const rupiah = n => "Rp " + new Intl.NumberFormat('id-ID').format(n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion:reduce)').matches;

// ----- audio (fails silently if blocked/missing) -----
let muted = false;
const VOL = { sfxTheme:0.35, sfxSuspense:0.5, sfxDing:0.85 };

function playSfx(id, { loop=false, fromStart=true } = {}){
  if(muted) return;
  const a = document.getElementById(id);
  if(!a) return;
  try{ if(fromStart) a.currentTime = 0; a.loop = loop; a.volume = VOL[id] ?? 0.7;
    const p = a.play(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
}
function stopSfx(id){ const a=document.getElementById(id); if(a){ try{ a.pause(); }catch(e){} } }

// theme song: starts on first user gesture, loops in the background
let themeStarted = false;
function startTheme(){
  if(themeStarted || muted) return;
  themeStarted = true;
  playSfx('sfxTheme', { loop:true });
}
function duckTheme(v){ const a=$('#sfxTheme'); if(a) try{ a.volume = v; }catch(e){} }

// mute toggle
function applyMute(){
  $('#btnMute').textContent = muted ? '🔇' : '🔊';
  $('#btnMute').classList.toggle('muted', muted);
  $('#btnMute').setAttribute('aria-pressed', String(muted));
  ['sfxTheme','sfxSuspense','sfxDing'].forEach(id=>{ const a=$('#'+id); if(a) a.muted = muted; });
  if(!muted && themeStarted) playSfx('sfxTheme', { loop:true, fromStart:false });
}
function initMute(){
  try{ muted = localStorage.getItem('revou_muted') === '1'; }catch(e){}
  applyMute();
  $('#btnMute').addEventListener('click', () => {
    muted = !muted;
    try{ localStorage.setItem('revou_muted', muted ? '1' : '0'); }catch(e){}
    applyMute();
    if(!muted && !themeStarted) startTheme();
  });
}
initMute();
// kick the theme on the very first interaction anywhere
document.addEventListener('pointerdown', startTheme, { once:true });

function pickPrize(){
  const total = PRIZES.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for(const p of PRIZES){ if((r-=p.weight) < 0) return p.amount; }
  return PRIZES[PRIZES.length-1].amount;
}

function showScene(id){
  $$('.scene').forEach(s => s.classList.remove('active'));
  $('#'+id).classList.add('active');
}

let state = { name:"", email:"", box:null, prize:null };

/* ============================================================
   BACKGROUND VIDEO (with CSS fallback)
   ============================================================ */
(function initBg(){
  const v = $('#bgvid');
  v.muted = true;                 // required for autoplay
  v.src = "/assets/bg_loop.mp4";
  v.addEventListener('error', () => { v.style.display='none'; }); // CSS aurora shows through
  // nudge playback (some browsers need an explicit call)
  const tryPlay = () => { const p = v.play(); if(p && p.catch) p.catch(()=>{}); };
  v.addEventListener('canplay', tryPlay);
  tryPlay();
  // if autoplay was blocked, start it on the first user interaction
  const kick = () => { tryPlay(); document.removeEventListener('pointerdown', kick); };
  document.addEventListener('pointerdown', kick);
})();

/* ============================================================
   PARTICLES (shared canvas)
   ============================================================ */
(function initParticles(){
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W,H, parts=[];
  function size(){ const r=cv.getBoundingClientRect();
    W=cv.width=r.width*devicePixelRatio; H=cv.height=r.height*devicePixelRatio; }
  size(); window.addEventListener('resize', size);
  const cols=['#ffcf3f','#6b53c9','#e7e8e2'];
  for(let i=0;i<26;i++) parts.push({x:Math.random(),y:Math.random(),
    s:Math.random()*2+1, sp:Math.random()*0.0003+0.0001, c:cols[i%3], d:Math.random()});
  let t=0;
  function frame(){ t++; ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{ p.y-=p.sp; if(p.y<0){p.y=1;p.x=Math.random();}
      const px=(p.x+Math.sin(t*0.01+p.d*6)*0.02)*W, py=p.y*H;
      ctx.globalAlpha=0.3+0.4*Math.abs(Math.sin(t*0.02+p.d*6));
      ctx.fillStyle=p.c; ctx.fillRect(px,py,p.s*devicePixelRatio,p.s*devicePixelRatio); });
    ctx.globalAlpha=1; if(!reduceMotion) requestAnimationFrame(frame); }
  frame();
})();

/* ============================================================
   CONFETTI (reveal)
   ============================================================ */
function burstConfetti(){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const r = cv.getBoundingClientRect();
  cv.width = r.width*devicePixelRatio; cv.height = r.height*devicePixelRatio;
  const cols=['#ffcf3f','#6b53c9','#e7e8e2','#34d399','#f59e0b'];
  const N = reduceMotion ? 30 : 90;
  const bits = Array.from({length:N}, ()=>({
    x: cv.width*(0.3+Math.random()*0.4), y: cv.height*0.3,
    vx:(Math.random()-0.5)*9*devicePixelRatio, vy:(Math.random()*-7-3)*devicePixelRatio,
    s:(Math.random()*5+4)*devicePixelRatio, c:cols[Math.floor(Math.random()*cols.length)],
    rot:Math.random()*6, vr:(Math.random()-0.5)*0.3
  }));
  let frames=0; const g=0.28*devicePixelRatio;
  (function loop(){ ctx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(b=>{ b.vy+=g; b.x+=b.vx; b.y+=b.vy; b.rot+=b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.fillStyle=b.c; ctx.fillRect(-b.s/2,-b.s/2,b.s,b.s); ctx.restore(); });
    frames++; if(frames<150) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ============================================================
   SHEETS API (optional)
   ============================================================ */
async function checkPlayed(email){
  if(!SHEET_API) return { played:false };
  try{
    const res = await fetch(SHEET_API + "?email=" + encodeURIComponent(email),
      { method:"GET" });
    return await res.json();
  }catch(e){ return { played:false, _error:true }; }
}
function logPlay(rec){
  if(!SHEET_API) return;
  // fire-and-forget; no-cors so it never blocks the reveal
  fetch(SHEET_API, { method:"POST", mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(rec) }).catch(()=>{});
}

/* ============================================================
   FLOW
   ============================================================ */
const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// ----- login modal (pops over the intro) -----
function openLogin(){
  const m = $('#loginModal');
  m.classList.add('open'); m.setAttribute('aria-hidden','false');
  $('#loginMsg').textContent = "";
  setTimeout(()=>$('#inName').focus(), 60);
}
function closeLogin(){
  const m = $('#loginModal');
  m.classList.remove('open'); m.setAttribute('aria-hidden','true');
}
$('#btnCloseLogin').addEventListener('click', closeLogin);
$('#loginModal').addEventListener('click', e => { if(e.target === $('#loginModal')) closeLogin(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#loginModal').classList.contains('open')) closeLogin();
});

$('#btnStart').addEventListener('click', startGame);
$('#inEmail').addEventListener('keydown', e => { if(e.key==='Enter') startGame(); });

async function startGame(){
  const name = $('#inName').value.trim();
  const email = $('#inEmail').value.trim().toLowerCase();
  const msg = $('#loginMsg');
  $('#inName').classList.remove('err'); $('#inEmail').classList.remove('err');
  msg.textContent = "";

  if(name.length < 2){ $('#inName').classList.add('err'); msg.textContent="Mohon isi nama kamu."; return; }
  if(!emailRe.test(email)){ $('#inEmail').classList.add('err'); msg.textContent="Email tidak valid."; return; }

  // local guard
  let local = null;
  try{ local = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }catch(e){}
  if(local && local.email === email){
    closeLogin(); return showAlreadyPlayed(local.prize);
  }

  // server guard
  const btn = $('#btnStart');
  btn.disabled = true; btn.textContent = "Mengecek…";
  const check = await checkPlayed(email);
  btn.disabled = false; btn.textContent = "Mulai Main →";
  if(check.played){ closeLogin(); return showAlreadyPlayed(check.prize); }

  state.name = name; state.email = email;
  closeLogin();
  showScene('s-choose');
}

function showAlreadyPlayed(prize){
  $('#noticeTitle').textContent = "Kamu sudah bermain!";
  $('#noticeBody').innerHTML = prize
    ? `Email ini sudah pernah ikut. Kamu memenangkan diskon <b style="color:var(--gold)">${prizeLabel(prize)}</b>. Setiap email hanya bisa bermain sekali.`
    : "Email ini sudah pernah ikut. Setiap email hanya bisa bermain sekali.";
  showScene('s-notice');
}

$('#btnOpen').addEventListener('click', openLogin);

// choosing a box
$$('#s-choose .choice').forEach(btn => {
  btn.addEventListener('click', () => onChoose(btn));
});

function onChoose(btn){
  if(state.box) return; // prevent double-pick
  state.box = btn.dataset.box;
  // fade the others
  $$('#s-choose .choice').forEach(b => { if(b !== btn) b.classList.add('faded'); });
  // set suspense box to chosen art, then advance
  $('#suspenseBox').src = `/digital-marketing/boxes/BB${state.box}.png`;
  setTimeout(runSuspense, 550);
}

async function runSuspense(){
  showScene('s-suspense');
  duckTheme(0.12);                 // lower the theme so suspense stands out
  playSfx('sfxSuspense', { loop:true });
  const box = $('#suspenseBox');
  const flash = $('#suspenseFlash');
  const chosen = `/digital-marketing/boxes/BB${state.box}.png`;
  const mystery = "/digital-marketing/boxes/BB_.png";

  // blink between chosen box and mystery box, slowing toward the end
  const delays = reduceMotion ? [400] : [180,180,180,200,220,250,300,360,440];
  let useMystery = false;
  for(const d of delays){
    useMystery = !useMystery;
    box.src = useMystery ? mystery : chosen;
    flash.style.transition = "opacity .12s"; flash.style.opacity = ".5";
    await sleep(60); flash.style.opacity = "0";
    await sleep(d);
  }
  box.src = mystery;
  await sleep(250);
  doReveal();
}

function doReveal(){
  stopSfx('sfxSuspense');
  duckTheme(VOL.sfxTheme);          // restore theme volume
  playSfx('sfxDing');
  state.prize = pickPrize();
  $('#prizeAmt').textContent = prizeLabel(state.prize);
  $('#revealBox').src = `/digital-marketing/boxes/BB${state.box}.png`;

  // white flash transition
  const wf = $('#revealFlash');
  wf.style.transition = "opacity .18s"; wf.style.opacity = "1";
  setTimeout(() => {
    showScene('s-reveal');
    wf.style.opacity = "0";
    burstConfetti();
  }, 180);

  // persist + log
  const rec = {
    name: state.name, email: state.email,
    prize: state.prize, box: state.box,
    program: TRACK,
    ts: new Date().toISOString(),
    ua: navigator.userAgent
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({email:state.email, prize:state.prize})); }catch(e){}
  logPlay(rec);
}

$('#btnClaim').addEventListener('click', () => {
  $('#noticeTitle').textContent = "Diskon Tersimpan!";
  $('#noticeBody').innerHTML = `Diskon <b style="color:var(--gold)">${prizeLabel(state.prize)}</b> sudah tercatat untuk <b>${state.email}</b>. Silakan kirim bukti screenshot ini ke Tim RevoU yg menghubungi kamu utk kamu claim. Terima kasih sudah bermain! 🎉`;
  showScene('s-notice');
});
</script>
